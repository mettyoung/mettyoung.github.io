# Projects shown on /projects/. featured: true renders as the large card on top.
- title: Credit Card Application Modulith System
  featured: true
  summary: >-
    A credit card application workflow (draft, ID upload, submit, identity check, decision) built as a
    modular monolith on Postgres alone: transactional outbox, inbox, database leases and a reconciler,
    so double-clicks, crashes and lost webhooks never start, skip or repeat a step.
  tags: [Java 21, Spring Boot, PostgreSQL, S3 uploads, Cloudflare Containers]
  links:
    - { label: Live demo, url: "https://creditcardapplication.mettyoung.com/" }
    - { label: Architecture, url: "https://creditcardapplication.mettyoung.com/architecture/decision-loop.html" }
    - { label: Article, url: "/engineering-a-durable-workflow-system/" }
    - { label: Source, url: "https://github.com/mettyoung/credit-card-system" }

